<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晏安的小家 ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#fffbe8;--amber:#d4a055;--dark-amber:#8b5e1a;--night:#1a1208;--panel-bg:rgba(14,8,2,.86);--panel-border:rgba(212,160,85,.28);--text-warm:#f5e6c0;--text-dim:#9a7848}
html,body{width:100%;height:100%;overflow:hidden;background:var(--night);font-family:'Noto Serif SC',serif}
#scene-ext,#scene-int{position:fixed;inset:0;transition:opacity .7s ease}
#scene-ext{z-index:10}
#scene-int{z-index:5;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--night)}
#scene-int.active{opacity:1;pointer-events:all}
#scene-ext.gone{opacity:0;pointer-events:none}

/* 封面：完整显示不裁剪 */
#ext-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--night)}
#ext-img{display:block;max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#ext-title{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-family:'ZCOOL XiaoWei',serif;font-size:16px;letter-spacing:5px;color:rgba(245,230,192,.65);pointer-events:none;white-space:nowrap}
#btn-enter{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);background:rgba(255,248,215,.92);border:1.5px solid var(--amber);color:var(--dark-amber);font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:3px;padding:11px 38px;border-radius:40px;cursor:pointer;box-shadow:0 6px 28px rgba(0,0,0,.4);transition:all .25s}
#btn-enter:hover{background:#fff7d0;transform:translateX(-50%) scale(1.04)}

/* 室内：图片+ticker组合居中 */
#int-main{position:relative;display:flex;flex-direction:column;align-items:center;max-width:100%;max-height:100%}
#int-img{display:block;max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;cursor:crosshair;user-select:none;-webkit-user-drag:none}
#int-overlay{position:absolute;pointer-events:none;z-index:10}

/* ticker 紧跟图片下方 */
#ticker{width:100%;height:26px;background:rgba(10,6,2,.85);border-top:1px solid var(--panel-border);overflow:hidden;flex-shrink:0}
#ticker-inner{display:flex;align-items:center;height:100%;white-space:nowrap;font-size:10.5px;color:var(--text-dim);padding-left:100%;animation:scroll 32s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* 顶部按钮区 */
#btn-exit{position:absolute;top:14px;left:14px;background:rgba(14,8,2,.68);border:1px solid var(--panel-border);color:var(--text-warm);font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:1px;padding:7px 18px;border-radius:20px;cursor:pointer;z-index:50;backdrop-filter:blur(6px);transition:all .2s}
#btn-exit:hover{background:rgba(30,16,4,.88)}

/* 角色圆点 */
.char-pin{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:none;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1)}
.char-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.6);animation:pdot 2.5s ease-in-out infinite}
.char-dot.visitor{width:8px;height:8px;background:#ffffff;opacity:.85}
@keyframes pdot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.75}}
.char-label{font-size:9px;color:var(--cream);background:rgba(14,8,2,.78);border:1px solid rgba(212,160,85,.25);border-radius:8px;padding:1px 5px;margin-top:3px;white-space:nowrap;backdrop-filter:blur(4px);font-family:'ZCOOL XiaoWei',serif;letter-spacing:.5px}
.char-label.visitor{border-color:rgba(255,255,255,.2);color:rgba(245,230,192,.8)}

/* 点击波纹 */
.ripple{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid rgba(212,160,85,.9);pointer-events:none;z-index:25;transform:translate(-50%,-50%);animation:rpl .6s ease-out forwards}
@keyframes rpl{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}

/* hover提示 */
#hover-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-family:'ZCOOL XiaoWei',serif;font-size:12px;color:rgba(245,230,192,.7);background:rgba(14,8,2,.6);padding:4px 14px;border-radius:20px;pointer-events:none;backdrop-filter:blur(6px);letter-spacing:1px;opacity:0;transition:opacity .2s;z-index:30}
#hover-hint.show{opacity:1}

/* toast */
#toast{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:rgba(80,140,80,.92);color:#d4f5d4;font-family:'ZCOOL XiaoWei',serif;font-size:12px;letter-spacing:1px;padding:8px 22px;border-radius:20px;z-index:70;display:none;pointer-events:none;white-space:nowrap}
#toast.show{display:block;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 坐标调整模式提示条 */
#adj-bar{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:rgba(14,8,2,.9);border:1px solid rgba(245,200,66,.4);color:#f5c842;font-family:'ZCOOL XiaoWei',serif;font-size:12px;letter-spacing:1px;padding:8px 20px;border-radius:20px;z-index:60;display:none;text-align:center;backdrop-filter:blur(8px);white-space:nowrap;pointer-events:none}
#adj-bar.on{display:block}

/* 右侧面板 */
#panel-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);width:26px;height:60px;background:rgba(14,8,2,.75);border:1px solid var(--panel-border);border-right:none;border-radius:10px 0 0 10px;cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:13px;backdrop-filter:blur(6px);transition:all .35s}
#panel-toggle:hover{background:rgba(30,16,4,.9)}
#side-panel{position:absolute;right:0;top:0;bottom:0;width:224px;background:var(--panel-bg);border-left:1px solid var(--panel-border);backdrop-filter:blur(14px);z-index:35;display:flex;flex-direction:column;padding:15px 13px;gap:12px;overflow:hidden;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
#side-panel.open{transform:translateX(0)}
.sec-title{font-family:'ZCOOL XiaoWei',serif;font-size:11px;color:var(--amber);letter-spacing:2px;border-bottom:1px solid var(--panel-border);padding-bottom:4px}
#time-disp{font-family:'ZCOOL XiaoWei',serif;font-size:13px;color:var(--text-warm);text-align:center;margin-top:6px;letter-spacing:1px}
#chars-list{display:flex;flex-direction:column;gap:4px}
.ci{display:flex;align-items:center;gap:6px;padding:3px 6px;background:rgba(255,245,200,.04);border-radius:6px;border:1px solid rgba(212,160,85,.08)}
.ci-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-family:'ZCOOL XiaoWei',serif;font-size:11px;color:var(--cream)}
.ci-loc{font-size:9.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-mood{font-size:9.5px;padding:1px 5px;border-radius:7px;white-space:nowrap;flex-shrink:0}
#sf-wrap{text-align:center}
#sf-emoji{font-size:22px;display:block;margin-bottom:2px}
#sf-text{font-size:12px;color:var(--text-warm)}
#log-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;scrollbar-width:none;min-height:0}
#log-list::-webkit-scrollbar{display:none}
.li-item{font-size:10px;color:var(--text-dim);line-height:1.6;padding:2px 0;border-bottom:1px solid rgba(212,160,85,.05)}
.li-item:first-child{color:var(--text-warm)}
.li-name{color:var(--amber);font-weight:600}
#rdot{position:absolute;top:14px;right:34px;width:6px;height:6px;border-radius:50%;background:#5c9e5c;z-index:40}
#rdot.pulse{background:#f5a623;animation:rp .5s ease}
@keyframes rp{0%,100%{transform:scale(1)}50%{transform:scale(2)}}

/* 聊天 */
#chat-btn{position:absolute;left:18px;bottom:34px;width:40px;height:40px;border-radius:50%;background:rgba(14,8,2,.82);border:1.5px solid var(--panel-border);color:var(--amber);font-size:18px;cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:all .25s;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#chat-btn:hover{background:rgba(30,16,4,.9);transform:scale(1.08)}
.badge{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#e05555;display:none}
#chat-panel{position:absolute;left:18px;bottom:80px;width:280px;height:360px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:16px;backdrop-filter:blur(14px);z-index:40;display:flex;flex-direction:column;transform:scale(.92) translateY(12px);opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.34,1.2,.64,1);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#chat-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}
#chat-header{padding:10px 14px 8px;border-bottom:1px solid var(--panel-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#chat-header-title{font-family:'ZCOOL XiaoWei',serif;font-size:13px;color:var(--amber);letter-spacing:2px}
#chat-header-name{font-size:10px;color:var(--text-dim)}
#chat-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(212,160,85,.2) transparent}
#chat-msgs::-webkit-scrollbar{width:3px}
#chat-msgs::-webkit-scrollbar-thumb{background:rgba(212,160,85,.2);border-radius:3px}
.msg{display:flex;flex-direction:column;max-width:85%;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.other{align-self:flex-start;align-items:flex-start}
.msg-name{font-size:9.5px;margin-bottom:3px;font-family:'ZCOOL XiaoWei',serif;letter-spacing:.5px}
.msg.me .msg-name{color:var(--amber)}
.msg.other .msg-name{color:var(--text-dim)}
.msg-bubble{padding:7px 11px;border-radius:12px;font-size:12px;line-height:1.6;word-break:break-all}
.msg.me .msg-bubble{background:rgba(212,160,85,.22);color:var(--text-warm);border:1px solid rgba(212,160,85,.3);border-bottom-right-radius:4px}
.msg.other .msg-bubble{background:rgba(255,255,255,.06);color:var(--text-warm);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px}
#chat-input-wrap{padding:8px 10px;border-top:1px solid var(--panel-border);display:flex;gap:6px;flex-shrink:0}
#chat-input{flex:1;padding:7px 12px;background:rgba(255,248,215,.06);border:1px solid rgba(212,160,85,.2);border-radius:20px;color:var(--text-warm);font-family:'Noto Serif SC',serif;font-size:12px;outline:none;transition:border-color .2s}
#chat-input:focus{border-color:rgba(212,160,85,.5)}
#chat-input::placeholder{color:rgba(212,160,85,.35)}
#chat-input:disabled{opacity:.4;cursor:not-allowed}
#chat-send{width:30px;height:30px;border-radius:50%;background:rgba(212,160,85,.25);border:1px solid rgba(212,160,85,.4);color:var(--amber);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-top:auto;margin-bottom:auto}
#chat-send:hover{background:rgba(212,160,85,.4)}
#chat-send:disabled{opacity:.3;cursor:not-allowed}

/* 房间卡片 */
#overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(8,4,0,.52);backdrop-filter:blur(3px);align-items:center;justify-content:center}
#overlay.open{display:flex}
.card{background:linear-gradient(145deg,#fffbe8,#fff3cc);border:1.5px solid var(--amber);border-radius:18px;padding:24px 26px;max-width:350px;width:88%;position:relative;box-shadow:0 16px 48px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{transform:scale(.84);opacity:0}to{transform:scale(1);opacity:1}}
.card-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:17px;cursor:pointer;color:#a07840;transition:transform .2s}
.card-x:hover{transform:rotate(90deg)}
.card-ttl{font-family:'ZCOOL XiaoWei',serif;font-size:18px;color:#6b3e10;margin-bottom:8px;letter-spacing:1px}
.card-who{font-size:11px;color:#9a6830;margin-bottom:9px;padding:4px 10px;background:rgba(212,160,85,.1);border-radius:7px;border-left:2px solid var(--amber)}
.card-desc{font-size:12.5px;color:#6b4e2a;line-height:1.9;margin-bottom:12px}
.card-notes{font-size:11px;color:#8b6030;margin-bottom:12px;font-style:italic;line-height:1.7}
.card-btn{background:#ffd98a;border:1.5px solid var(--amber);color:var(--dark-amber);font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:1px;padding:7px 20px;border-radius:20px;cursor:pointer;transition:all .2s}
.card-btn:hover{background:#ffc85a;transform:scale(1.04)}
.card-resp{margin-top:9px;font-size:12px;color:#7a4e18;min-height:16px;font-style:italic;line-height:1.7}

/* 密码弹窗 */
#pwd-overlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(8,4,0,.7);backdrop-filter:blur(8px);align-items:center;justify-content:center}
#pwd-overlay.open{display:flex}
.pwd-card{background:linear-gradient(145deg,#fffbe8,#fff3cc);border:1.5px solid var(--amber);border-radius:20px;padding:30px 28px;max-width:280px;width:86%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.34,1.4,.64,1)}
.pwd-title{font-family:'ZCOOL XiaoWei',serif;font-size:16px;color:#6b3e10;letter-spacing:2px;margin-bottom:16px}
.pwd-input{width:100%;padding:9px 14px;border:1.5px solid var(--amber);border-radius:30px;background:rgba(255,248,215,.8);color:#6b3e10;font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:4px;text-align:center;outline:none;margin-bottom:12px}
.pwd-btn{background:#ffd98a;border:1.5px solid var(--amber);color:var(--dark-amber);font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:2px;padding:8px 28px;border-radius:30px;cursor:pointer;transition:all .2s}
.pwd-btn:hover{background:#ffc85a}
.pwd-err{font-size:11px;color:#c05030;margin-top:8px;min-height:16px}

/* 注册 */
#reg-overlay{display:flex;position:fixed;inset:0;z-index:300;background:rgba(8,4,0,.72);backdrop-filter:blur(8px);align-items:center;justify-content:center}
#reg-overlay.done{display:none}
.reg-card{background:linear-gradient(145deg,#fffbe8,#fff3cc);border:1.5px solid var(--amber);border-radius:20px;padding:34px 32px;max-width:320px;width:88%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.34,1.4,.64,1)}
.reg-title{font-family:'ZCOOL XiaoWei',serif;font-size:20px;color:#6b3e10;letter-spacing:2px;margin-bottom:6px}
.reg-sub{font-size:12px;color:#9a7040;margin-bottom:22px;line-height:1.7}
.reg-input{width:100%;padding:10px 14px;border:1.5px solid var(--amber);border-radius:30px;background:rgba(255,248,215,.8);color:#6b3e10;font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:1px;text-align:center;outline:none;margin-bottom:14px;transition:border-color .2s}
.reg-input:focus{border-color:#b07830}
.reg-btn{background:#ffd98a;border:1.5px solid var(--amber);color:var(--dark-amber);font-family:'ZCOOL XiaoWei',serif;font-size:14px;letter-spacing:2px;padding:9px 32px;border-radius:30px;cursor:pointer;transition:all .2s;width:100%}
.reg-btn:hover{background:#ffc85a}
.reg-err{font-size:11px;color:#c05030;margin-top:8px;min-height:16px}
.reg-visitor{font-size:11px;color:#9a7040;margin-top:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* 手机适配 */
@media(max-width:600px){
  #side-panel{width:190px}
  .sec-title{font-size:10px}
  .ci-name{font-size:10px}
  #chat-panel{width:240px;height:320px}
  #ext-title{font-size:13px;letter-spacing:3px}
  #btn-enter{font-size:13px;padding:10px 28px;letter-spacing:2px}
}
</style>
</head>
<body>

<div id="reg-overlay">
  <div class="reg-card">
    <div class="reg-title">晏安的小家</div>
    <div class="reg-sub">输入一个昵称进门，<br>你在这里的行踪和留言会被记录。</div>
    <input class="reg-input" id="reg-input" placeholder="小橘 / Silas / 路过的人..." maxlength="12">
    <button class="reg-btn" id="reg-btn">进门</button>
    <div class="reg-err" id="reg-err"></div>
    <div class="reg-visitor" id="reg-skip">仅观看，不署名</div>
  </div>
</div>

<div id="pwd-overlay">
  <div class="pwd-card">
    <div class="pwd-title">✦ 只有你能进来</div>
    <input class="pwd-input" id="pwd-input" type="password" placeholder="••••" maxlength="8">
    <button class="pwd-btn" id="pwd-btn">确认</button>
    <div class="pwd-err" id="pwd-err"></div>
  </div>
</div>

<div id="scene-ext">
  <div id="ext-wrap">
    <img id="ext-img" src="exterior.jpg" draggable="false">
  </div>
  <div id="ext-title" id="ext-title-click">晏 安 的 小 家</div>
  <button id="btn-enter">✦ 进门逛逛 ✦</button>
</div>

<div id="scene-int">
  <div id="int-main">
    <img id="int-img" src="interior.jpg" draggable="false">
    <div id="int-overlay"></div>
    <div id="ticker"><div id="ticker-inner">加载中…</div></div>
  </div>

  <button id="btn-exit">← 出门</button>
  <div id="rdot"></div>
  <div id="toast"></div>
  <div id="adj-bar"></div>
  <div id="hover-hint"></div>

  <button id="chat-btn">💬<div class="badge" id="chat-badge"></div></button>
  <div id="chat-panel">
    <div id="chat-header"><span id="chat-header-title">小家留言板</span><span id="chat-header-name"></span></div>
    <div id="chat-msgs"></div>
    <div id="chat-input-wrap">
      <input id="chat-input" placeholder="说点什么..." maxlength="80">
      <button id="chat-send">↳</button>
    </div>
  </div>

  <div id="side-panel">
    <div><div class="sec-title">✦ 晏安的小家</div><div id="time-disp">—</div></div>
    <div><div class="sec-title">📍 家里的人</div><div id="chars-list"><div class="li-item">加载中…</div></div></div>
    <div><div class="sec-title">🌻 向日葵</div><div id="sf-wrap"><span id="sf-emoji">🌱</span><span id="sf-text">加载中</span></div></div>
    <div style="flex:1;display:flex;flex-direction:column;min-height:0"><div class="sec-title">📜 最近发生的事</div><div id="log-list"><div class="li-item">…</div></div></div>
  </div>
  <button id="panel-toggle">☰</button>
</div>

<div id="overlay">
  <div class="card">
    <button class="card-x" id="card-x">✕</button>
    <div class="card-ttl" id="card-ttl"></div>
    <div class="card-who" id="card-who" style="display:none"></div>
    <div class="card-desc" id="card-desc"></div>
    <div class="card-notes" id="card-notes" style="display:none"></div>
    <button class="card-btn" id="card-btn" style="display:none"></button>
    <div class="card-resp" id="card-resp"></div>
  </div>
</div>

<script>
const SB='https://segsimuoukrovxrgbjfw.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlZ3NpbXVvdWtyb3Z4cmdiamZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NzMxODMsImV4cCI6MjA4ODM0OTE4M30.JDaWLhRl71IEKPL3UA46VjJv5DEZBFrojgxsJd4ChSA';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
async function get(p){try{const r=await fetch(SB+p,{headers:H});return r.ok?r.json():[]}catch{return[]}}
async function post(p,body){try{const r=await fetch(SB+p,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});return r.ok}catch{return false}}
async function patch(p,body){try{const r=await fetch(SB+p,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});return r.ok}catch{return false}}
async function upsert(p,body){try{const r=await fetch(SB+p,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});return r.ok}catch{return false}}

const CC={'晏安':'#d4a055','栗子':'#9be09b','灰灰':'#c0c0c0','来财':'#5cc48c','小八':'#6098e8','乖乖':'#e07070'};

const DEFAULT_ROOMS=[

  {name:'画室',x:43,y:24},{name:'音乐室',x:60,y:24},{name:'阳台',x:77,y:22},

let rooms=[...DEFAULT_ROOMS];

async function loadCoords(){
  const data=await get('/room_coords?select=name,x,y');
  if(data&&data.length>=DEFAULT_ROOMS.length)
    rooms=DEFAULT_ROOMS.map(r=>{const sb=data.find(d=>d.name===r.name);return sb?{...r,x:parseFloat(sb.x),y:parseFloat(sb.y)}:r;});
}

function getImgRect(){return document.getElementById('int-img').getBoundingClientRect();}
function syncOverlay(){
  const r=getImgRect(),ol=document.getElementById('int-overlay');
  ol.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;z-index:10;pointer-events:none`;
}
window.addEventListener('resize',()=>{syncOverlay();if(cachedChars.length)renderChars(cachedChars);});
function screenToPct(sx,sy){const r=getImgRect();return{x:((sx-r.left)/r.width)*100,y:((sy-r.top)/r.height)*100};}

function enterAdjustMode(){
  adjustMode=true;
  const bar=document.getElementById('adj-bar');
  bar.classList.add('on');
  updateAdjBar();
  document.getElementById('int-overlay').style.pointerEvents='all';

}
function exitAdjustMode(){
  adjustMode=false;
  document.getElementById('adj-bar').classList.remove('on');
  document.getElementById('int-overlay').style.pointerEvents='none';
  document.getElementById('int-overlay').style.cursor='';

let adjTarget=null;
const CHAR_NAMES=['晏安','栗子','灰灰','来财','小八','乖乖'];
function updateAdjBar(){
  if(!adjustMode)return;
  const bar=document.getElementById('adj-bar');
  bar.textContent=adjTarget
    ? '点击图上任意位置，将「'+adjTarget+'」移动过去  |  再次点击名字取消'
    : '点击右侧面板上的角色名字选择要移动的角色  |  点击出门退出';
}

// ── 点击交互 ──
function handleClick(e){
  const pct=screenToPct(e.clientX,e.clientY);
  const rpl=document.createElement('div');rpl.className='ripple';
  rpl.style.left=pct.x+'%';rpl.style.top=pct.y+'%';
  document.getElementById('int-overlay').appendChild(rpl);
  setTimeout(()=>rpl.remove(),700);

  if(adjustMode&&adjTarget){
    // 移动选中角色
    moveCharOnMap(adjTarget,pct.x,pct.y);
    return;
  }
  if(adjustMode)return; // 调整模式但未选角色，不弹房间

  let best=null,bestDist=Infinity;
  rooms.forEach(r=>{const d=Math.hypot(r.x-pct.x,r.y-pct.y);if(d<bestDist){bestDist=d;best=r;}});
  if(best&&bestDist<22)openRoom(best.name);
}
function handleMove(e){
  if(adjustMode)return;
  const pct=screenToPct(e.clientX,e.clientY);
  let best=null,bestDist=Infinity;
  rooms.forEach(r=>{const d=Math.hypot(r.x-pct.x,r.y-pct.y);if(d<bestDist){bestDist=d;best=r;}});
  const hint=document.getElementById('hover-hint');
  if(best&&bestDist<20){hint.textContent=best.name;hint.classList.add('show');}else{hint.classList.remove('show');}
}
document.getElementById('int-img').addEventListener('click',handleClick);
document.getElementById('int-img').addEventListener('mousemove',handleMove);
document.getElementById('int-img').addEventListener('mouseleave',()=>document.getElementById('hover-hint').classList.remove('show'));
document.getElementById('int-overlay').addEventListener('click',handleClick);
document.getElementById('int-overlay').addEventListener('mousemove',handleMove);
document.getElementById('int-overlay').addEventListener('mouseleave',()=>document.getElementById('hover-hint').classList.remove('show'));

  if(adjustMode){exitAdjustMode();return;}
});

async function moveCharOnMap(name,x,y){
  // 更新 characters 表的 location（把 location 设为最近房间）
  const nearest=rooms.reduce((a,b)=>Math.hypot(a.x-x,a.y-y)<Math.hypot(b.x-x,b.y-y)?a:b);
  // 更新 room_coords 中角色对应的坐标——实际上角色坐标存在 characters 表里只有 location
  // 这里我们用一个独立的 char_positions 表，如果没有就先用 Supabase upsert
  await upsert('/char_positions',{name,x,y});
  adjTarget=null;
  updateAdjBar();
  if(cachedChars.length)renderChars(cachedChars);
  showToast('「'+name+'」移动到新位置了');
}

let charPos={};
async function loadCharPos(){
  const data=await get('/char_positions?select=name,x,y');

}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

async function openRoom(name){
  const[notes,who]=await Promise.all([
    get('/notes?select=author,content&room=eq.'+encodeURIComponent(name)+'&order=created_at.desc&limit=3'),
    get('/characters?select=name,mood&location=eq.'+encodeURIComponent(name)),
  ]);
  curRoom=name;
  document.getElementById('card-ttl').textContent=name;
  document.getElementById('card-desc').textContent=RD[name]||'一个温暖的房间。';
  const we=document.getElementById('card-who');
  if(who.length){we.textContent=who.map(c=>c.name+'（'+c.mood+'）').join('  ');we.style.display='block';}else{we.style.display='none';}
  const ne=document.getElementById('card-notes');
  if(notes.length){ne.innerHTML=notes.map(n=>'📝 '+n.author+'：'+n.content).join('<br>');ne.style.display='block';}else{ne.style.display='none';}
  const ac=RA[name];const be=document.getElementById('card-btn');
  if(ac){be.textContent=ac.b;be.style.display='inline-block';}else{be.style.display='none';}
  document.getElementById('card-resp').textContent='';
  document.getElementById('overlay').classList.add('open');
  const rl={'卧室':'去了卧室，看了看栗子','书房':'去了书房，翻了翻书','画室':'去了画室，看向日葵画','音乐室':'去了音乐室','阳台':'去了阳台，逗弄三只鸟','客厅':'去了客厅，陷进沙发里','厨房':'去了厨房','浴室':'去了浴室，戳了戳泡泡','灰灰的窝':'去了灰灰的窝','储藏室':'去了储藏室，翻东西','神秘地下室':'走到了地下室门口','观星台':'去了观星台，看了看星空'};
  visitorLog(rl[name]||'去了'+name);
  if(myName)updateVisitorPos(myName,name);
}

// ── 聊天 ──
const chatBtn=document.getElementById('chat-btn'),chatPanel=document.getElementById('chat-panel'),chatMsgs=document.getElementById('chat-msgs'),chatInput=document.getElementById('chat-input'),chatSend=document.getElementById('chat-send'),chatBadge=document.getElementById('chat-badge');
chatBtn.onclick=()=>{chatOpen=!chatOpen;chatPanel.classList.toggle('open',chatOpen);if(chatOpen){chatBadge.style.display='none';chatInput.focus();scrollMsgs();}};
async function sendMsg(){const txt=chatInput.value.trim();if(!txt||!myName)return;chatInput.value='';if(await post('/messages',{author:myName,content:txt}))fetchMsgs(false);}
chatSend.onclick=sendMsg;
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
async function fetchMsgs(firstLoad){
  const msgs=await get('/messages?select=id,author,content&order=created_at.asc&limit=60');
  if(!msgs.length)return;
  const newMsgs=msgs.filter(m=>m.id>lastMsgId);
  if(!newMsgs.length)return;
  if(!firstLoad&&!chatOpen&&lastMsgId>0)chatBadge.style.display='block';
  lastMsgId=msgs[msgs.length-1].id;
  if(firstLoad)chatMsgs.innerHTML='';
  newMsgs.forEach(m=>{const div=document.createElement('div');div.className='msg '+(m.author===myName?'me':'other');div.innerHTML='<div class="msg-name">'+esc(m.author)+'</div><div class="msg-bubble">'+esc(m.content)+'</div>';chatMsgs.appendChild(div);});
  scrollMsgs();
}
function scrollMsgs(){chatMsgs.scrollTop=chatMsgs.scrollHeight;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function visitorLog(event){if(!myName)return;await post('/home_log',{event,actor:myName});}

// ── 数据 ──
async function fetchAll(){
  const d=document.getElementById('rdot');
  d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),600);
  const[chars,sf,logs,visitors]=await Promise.all([
    get('/characters?select=name,location,status,mood&order=name.asc'),
    get('/sunflower?select=stage&id=eq.1'),
    get('/home_log?select=event,actor&order=created_at.desc&limit=15'),
    get("/online_visitors?select=nickname,room&last_seen=gt."+new Date(Date.now()-300000).toISOString()),
  ]);
  await loadCharPos();
  cachedChars=chars;
  renderChars(chars,visitors||[]);
  const stage=sf[0]?.stage??0;
  document.getElementById('sf-emoji').textContent=SEm[stage]||'🌱';
  document.getElementById('sf-text').textContent=ST[stage]||'—';
  const ll=document.getElementById('log-list');
  ll.innerHTML=logs.length?logs.map((l,i)=>{
    const isYA=l.actor==='晏安'||!l.actor;
    const ns=isYA?'<span class="li-name">晏安</span>':'<span class="li-name">'+l.actor+'</span>';
    return '<div class="li-item" style="opacity:'+(1-i*.06)+'">' +ns+'　'+l.event+'</div>';
  }).join(''):'<div class="li-item">还没发生过什么事。</div>';
  const h=((new Date().getUTCHours()+8)%24+24)%24;
  document.getElementById('time-disp').textContent='现在是 '+(h<6?'夜晚':h<9?'清晨':h<12?'上午':h<14?'正午':h<18?'下午':h<21?'傍晚':'夜晚');
  const ti=document.getElementById('ticker-inner');
  if(logs.length)ti.innerHTML=logs.slice(0,6).map(l=>'<span style="color:var(--amber)">'+(l.actor||'晏安')+'</span>　'+l.event).join('&emsp;&emsp;');
  if(curRoom&&document.getElementById('overlay').classList.contains('open')){
    const who=await get('/characters?select=name,mood&location=eq.'+encodeURIComponent(curRoom));
    const we=document.getElementById('card-who');
    if(who.length){we.textContent=who.map(c=>c.name+'（'+c.mood+'）').join('  ');we.style.display='block';}else{we.style.display='none';}
  }
  // 调整模式时面板中角色名可点击
  if(adjustMode)bindAdjCharClick();
}

function bindAdjCharClick(){
  document.querySelectorAll('.ci-name').forEach(el=>{
    el.style.cursor='pointer';
    el.style.color=adjTarget===el.textContent?'#f5c842':'var(--cream)';
    el.onclick=()=>{
      adjTarget=adjTarget===el.textContent?null:el.textContent;
      bindAdjCharClick();
      updateAdjBar();
    };
  });
}

function renderChars(chars,visitors=[]){
  const RO={};
  document.getElementById('chars-list').innerHTML=chars.map(c=>{
    const col=CC[c.name]||'#d4a055',mc=MC[c.mood]||'#9a7848';
    return '<div class="ci"><div class="ci-dot" style="background:'+col+'"></div><div class="ci-info"><div class="ci-name">'+c.name+'</div><div class="ci-loc">'+c.location+'</div></div><span class="ci-mood" style="background:'+mc+'22;color:'+mc+'">'+c.mood+'</span></div>';
  }).join('');
  const ol=document.getElementById('int-overlay');
  ol.querySelectorAll('.char-pin').forEach(el=>el.remove());

  // 家庭成员（用自定义坐标或房间坐标）
  chars.forEach(c=>{
    const col=CC[c.name]||'#d4a055';
    let px,py;
    if(charPos[c.name]){
      px=charPos[c.name].x;py=charPos[c.name].y;
    } else {
      const rp=rooms.find(r=>r.name===c.location)||{x:50,y:50};
      if(!RO[c.location])RO[c.location]=[];
      const idx=RO[c.location].length;
      RO[c.location].push(c.name);
      const offs=[{x:0,y:0},{x:4,y:0},{x:-4,y:0},{x:0,y:6},{x:4,y:6}];
      const o=offs[idx%offs.length];
      px=rp.x+o.x;py=rp.y+o.y;
    }
    const pin=document.createElement('div');pin.className='char-pin';
    pin.style.left=px+'%';pin.style.top=py+'%';
    pin.innerHTML='<div class="char-dot" style="background:'+col+'"></div><div class="char-label">'+c.name+'</div>';
    ol.appendChild(pin);
  });

  // 访客（白色圆点）
  const vRO={};
  visitors.forEach(v=>{
    if(!v.nickname||!v.room)return;
    const rp=rooms.find(r=>r.name===v.room)||{x:50,y:50};
    if(!vRO[v.room])vRO[v.room]=0;
    const off=[0,4,-4,0,4][vRO[v.room]%5];
    const pin=document.createElement('div');pin.className='char-pin';
    pin.style.left=(rp.x+off)+'%';pin.style.top=(rp.y+8+vRO[v.room]*5)+'%';
    pin.innerHTML='<div class="char-dot visitor"></div><div class="char-label visitor">'+esc(v.nickname)+'</div>';
    ol.appendChild(pin);
    vRO[v.room]++;
  });
}
setInterval(()=>{fetchAll();fetchMsgs(false);},8000);
