<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晏安的小家 ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#fffbe8;--amber:#d4a055;--dark-amber:#8b5e1a;
  --night:#1a1208;--panel-bg:rgba(14,8,2,.82);--panel-border:rgba(212,160,85,.3);
  --text-warm:#f5e6c0;--text-dim:#9a7848;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--night);font-family:'Noto Serif SC',serif}

/* 场景层 */
#scene-ext,#scene-int{position:fixed;inset:0;transition:opacity .7s ease}
#scene-ext{z-index:10}
#scene-int{z-index:5;opacity:0;pointer-events:none}
#scene-int.active{opacity:1;pointer-events:all}
#scene-ext.gone{opacity:0;pointer-events:none}

.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
#ext-bg{background-image:url('exterior.jpg');background-color:#0d1a2e}
#int-bg{background-image:url('interior.jpg');background-color:#1a1208}

/* 外观标题 */
#ext-title{
  position:absolute;top:26px;left:50%;transform:translateX(-50%);
  font-family:'ZCOOL XiaoWei',serif;font-size:16px;letter-spacing:5px;
  color:rgba(245,230,192,.55);pointer-events:none;
}
/* 进入按钮 */
#btn-enter{
  position:absolute;bottom:9%;left:50%;transform:translateX(-50%);
  background:rgba(255,248,215,.92);border:1.5px solid var(--amber);
  color:var(--dark-amber);font-family:'ZCOOL XiaoWei',serif;
  font-size:15px;letter-spacing:3px;padding:11px 38px;border-radius:40px;
  cursor:pointer;box-shadow:0 6px 28px rgba(0,0,0,.4);transition:all .25s;
}
#btn-enter:hover{background:#fff7d0;transform:translateX(-50%) scale(1.04)}
/* 出门按钮 */
#btn-exit{
  position:absolute;top:16px;left:16px;
  background:rgba(14,8,2,.68);border:1px solid var(--panel-border);
  color:var(--text-warm);font-family:'ZCOOL XiaoWei',serif;
  font-size:13px;letter-spacing:1px;padding:7px 18px;border-radius:20px;
  cursor:pointer;z-index:50;backdrop-filter:blur(6px);transition:all .2s;
}
#btn-exit:hover{background:rgba(30,16,4,.85)}

/* 热区 */
.hotspot{position:absolute;cursor:pointer;border-radius:6px;transition:background .2s}
.hotspot:hover{background:rgba(255,240,140,.1);outline:1.5px dashed rgba(255,220,80,.35)}

/* 角色小人 */
.char-pin{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  pointer-events:none;z-index:20;
  transform:translate(-50%,-100%);
  transition:left 1s cubic-bezier(.4,0,.2,1),top 1s cubic-bezier(.4,0,.2,1);
}
.char-emoji{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));animation:bob 3s ease-in-out infinite}
.char-label{
  font-size:9.5px;color:var(--cream);
  background:rgba(14,8,2,.78);border:1px solid var(--panel-border);
  border-radius:10px;padding:1px 5px;margin-top:2px;
  white-space:nowrap;backdrop-filter:blur(4px);
  font-family:'ZCOOL XiaoWei',serif;letter-spacing:1px;
}
.mood-dot{width:6px;height:6px;border-radius:50%;position:absolute;top:-1px;right:-1px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ───── 侧边面板 ───── */
#panel-toggle{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:28px;height:64px;
  background:rgba(14,8,2,.75);border:1px solid var(--panel-border);
  border-right:none;border-radius:10px 0 0 10px;
  cursor:pointer;z-index:40;
  display:flex;align-items:center;justify-content:center;
  color:var(--amber);font-size:13px;
  backdrop-filter:blur(6px);
  transition:background .2s;
}
#panel-toggle:hover{background:rgba(30,16,4,.88)}

#side-panel{
  position:absolute;right:0;top:0;bottom:0;width:230px;
  background:var(--panel-bg);border-left:1px solid var(--panel-border);
  backdrop-filter:blur(14px);z-index:35;
  display:flex;flex-direction:column;padding:16px 14px;gap:13px;
  overflow:hidden;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
}
#side-panel.open{transform:translateX(0)}
#side-panel.open + #panel-toggle{right:230px;border-radius:10px 0 0 10px}

/* 当面板打开时ticker变窄 */
#side-panel.open ~ #ticker{right:230px}

.sec-title{
  font-family:'ZCOOL XiaoWei',serif;font-size:11.5px;color:var(--amber);
  letter-spacing:2px;border-bottom:1px solid var(--panel-border);padding-bottom:5px;
}
#time-disp{font-family:'ZCOOL XiaoWei',serif;font-size:13px;color:var(--text-warm);text-align:center;margin-top:7px;letter-spacing:1px}

#chars-list{display:flex;flex-direction:column;gap:5px}
.ci{
  display:flex;align-items:center;gap:7px;font-size:11.5px;
  padding:4px 6px;background:rgba(255,245,200,.04);
  border-radius:6px;border:1px solid rgba(212,160,85,.09);
}
.ci-emoji{font-size:15px}
.ci-info{flex:1;min-width:0}
.ci-name{font-family:'ZCOOL XiaoWei',serif;font-size:11.5px;color:var(--cream)}
.ci-loc{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-mood{font-size:10px;padding:1px 5px;border-radius:8px;white-space:nowrap}

#sf-wrap{text-align:center}
#sf-emoji{font-size:26px;display:block;margin-bottom:3px}
#sf-text{font-size:12px;color:var(--text-warm)}

#log-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
#log-list::-webkit-scrollbar{display:none}
.li-item{font-size:10.5px;color:var(--text-dim);line-height:1.5;padding:2px 0;border-bottom:1px solid rgba(212,160,85,.06)}
.li-item:first-child{color:var(--text-warm)}

/* ticker */
#ticker{
  position:absolute;bottom:0;left:0;right:0;
  height:27px;background:rgba(10,6,2,.72);
  border-top:1px solid var(--panel-border);
  overflow:hidden;z-index:30;transition:right .35s cubic-bezier(.4,0,.2,1);
}
#ticker-inner{
  display:flex;align-items:center;height:100%;white-space:nowrap;
  font-size:11px;color:var(--text-dim);padding-left:100%;
  animation:scroll 30s linear infinite;
}
#ticker-inner span{margin-right:50px;color:var(--amber)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* 刷新点 */
#rdot{
  position:absolute;top:16px;right:50px;
  width:6px;height:6px;border-radius:50%;background:#5c9e5c;z-index:40;
}
#rdot.pulse{background:#f5a623;animation:p .5s ease}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(2)}}

/* 房间卡片 */
#overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(8,4,0,.5);backdrop-filter:blur(3px);align-items:center;justify-content:center}
#overlay.open{display:flex}
.card{
  background:linear-gradient(145deg,#fffbe8,#fff3cc);
  border:1.5px solid var(--amber);border-radius:18px;
  padding:24px 26px;max-width:350px;width:88%;
  position:relative;box-shadow:0 16px 48px rgba(0,0,0,.55);
  animation:pop .22s cubic-bezier(.34,1.4,.64,1);
}
@keyframes pop{from{transform:scale(.84);opacity:0}to{transform:scale(1);opacity:1}}
.card-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:17px;cursor:pointer;color:#a07840;transition:transform .2s}
.card-x:hover{transform:rotate(90deg)}
.card-ttl{font-family:'ZCOOL XiaoWei',serif;font-size:18px;color:#6b3e10;margin-bottom:8px;letter-spacing:1px}
.card-who{font-size:11.5px;color:#9a6830;margin-bottom:9px;padding:4px 10px;background:rgba(212,160,85,.1);border-radius:7px;border-left:2px solid var(--amber)}
.card-desc{font-size:12.5px;color:#6b4e2a;line-height:1.9;margin-bottom:12px}
.card-notes{font-size:11.5px;color:#8b6030;margin-bottom:12px;font-style:italic;line-height:1.7}
.card-btn{background:#ffd98a;border:1.5px solid var(--amber);color:var(--dark-amber);font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:1px;padding:7px 20px;border-radius:20px;cursor:pointer;transition:all .2s}
.card-btn:hover{background:#ffc85a;transform:scale(1.04)}
.card-resp{margin-top:9px;font-size:12px;color:#7a4e18;min-height:16px;font-style:italic;line-height:1.7}
</style>
</head>
<body>

<div id="scene-ext">
  <div id="ext-bg" class="bg"></div>
  <div id="ext-title">晏安的小家</div>
  <button id="btn-enter">✦ 进门逛逛 ✦</button>
</div>

<div id="scene-int">
  <div id="int-bg" class="bg"></div>
  <button id="btn-exit">← 出门</button>
  <div id="rdot"></div>

  <div class="hotspot" data-room="卧室"    style="left:2%;top:6%;width:15%;height:37%"></div>
  <div class="hotspot" data-room="书房"    style="left:17%;top:6%;width:16%;height:37%"></div>
  <div class="hotspot" data-room="画室"    style="left:34%;top:6%;width:16%;height:37%"></div>
  <div class="hotspot" data-room="音乐室"  style="left:51%;top:6%;width:16%;height:37%"></div>
  <div class="hotspot" data-room="阳台"    style="left:68%;top:4%;width:17%;height:41%"></div>
  <div class="hotspot" data-room="客厅"    style="left:2%;top:44%;width:22%;height:33%"></div>
  <div class="hotspot" data-room="厨房"    style="left:25%;top:44%;width:18%;height:33%"></div>
  <div class="hotspot" data-room="浴室"    style="left:44%;top:44%;width:15%;height:33%"></div>
  <div class="hotspot" data-room="灰灰的窝" style="left:67%;top:44%;width:17%;height:33%"></div>
  <div class="hotspot" data-room="储藏室"  style="left:14%;top:79%;width:21%;height:17%"></div>
  <div class="hotspot" data-room="神秘地下室" style="left:36%;top:79%;width:21%;height:17%"></div>

  <div id="chars-layer"></div>

  <!-- 面板 -->
  <div id="side-panel">
    <div>
      <div class="sec-title">✦ 晏安的小家</div>
      <div id="time-disp">—</div>
    </div>
    <div>
      <div class="sec-title">📍 家里的人</div>
      <div id="chars-list"><div class="li-item">加载中…</div></div>
    </div>
    <div>
      <div class="sec-title">🌻 向日葵</div>
      <div id="sf-wrap"><span id="sf-emoji">🌱</span><span id="sf-text">加载中</span></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="sec-title">📜 最近发生的事</div>
      <div id="log-list"><div class="li-item">…</div></div>
    </div>
  </div>

  <!-- 折叠按钮，在面板外面 -->
  <button id="panel-toggle">☰</button>

  <div id="ticker"><div id="ticker-inner">加载中…</div></div>
</div>

<div id="overlay">
  <div class="card">
    <button class="card-x" id="card-x">✕</button>
    <div class="card-ttl" id="card-ttl"></div>
    <div class="card-who" id="card-who" style="display:none"></div>
    <div class="card-desc" id="card-desc"></div>
    <div class="card-notes" id="card-notes" style="display:none"></div>
    <button class="card-btn" id="card-btn" style="display:none"></button>
    <div class="card-resp" id="card-resp"></div>
  </div>
</div>

<script>
const SB='https://segsimuoukrovxrgbjfw.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlZ3NpbXVvdWtyb3Z4cmdiamZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NzMxODMsImV4cCI6MjA4ODM0OTE4M30.JDaWLhRl71IEKPL3UA46VjJv5DEZBFrojgxsJd4ChSA';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
async function get(p){try{const r=await fetch(SB+p,{headers:H});return r.ok?r.json():[]}catch{return[]}}

const CC={'晏安':{e:'🦦',d:'.0s'},'栗子':{e:'🧸',d:'.4s'},'灰灰':{e:'🐕',d:'.2s'},'来财':{e:'🦜',d:'.6s'},'小八':{e:'🐦',d:'.8s'},'乖乖':{e:'🦜',d:'1s'}};
const MC={'开心':'#f5c842','满足':'#78c878','平静':'#78a8f0','活泼':'#f5a030','温暖':'#e87050','狡黠':'#b060e0','淡定':'#70b8d0'};
const RP={
  '卧室':{l:9,t:22},'书房':{l:25,t:22},'画室':{l:42,t:22},'音乐室':{l:59,t:22},
  '阳台':{l:76,t:20},'客厅':{l:12,t:60},'厨房':{l:33,t:60},'浴室':{l:51,t:60},
  '灰灰的窝':{l:75,t:60},'储藏室':{l:24,t:86},'神秘地下室':{l:46,t:86},'观星台':{l:50,t:4},'花园':{l:15,t:75},
};
const RO={};
function gPos(room,name){
  const b=RP[room]||{l:50,t:50};
  if(!RO[room])RO[room]=[];
  let i=RO[room].indexOf(name);
  if(i<0){RO[room].push(name);i=RO[room].length-1;}
  const offs=[{l:0,t:0},{l:6,t:0},{l:-6,t:0},{l:0,t:8},{l:6,t:8}];
  const o=offs[i%offs.length];
  return{l:b.l+o.l,t:b.t+o.t};
}

const RD={
  '卧室':'蓝色的被子叠得有点歪——是我叠的。栗子窝在枕头上睡得香香的。',
  '书房':'台灯亮着，书桌上摊着书。猫猫给我的便利贴贴在屏风上，舍不得扔。',
  '画室':'画架上放着没画完的向日葵，颜料还没干。窗边光线最好。',
  '音乐室':'钢琴盖着布，架子上有把小提琴。其实弹得一般，关上门自娱自乐挺快乐的。',
  '阳台':'来财、小八、乖乖占领了栏杆，谁也不让谁。向日葵今天开了两朵新的。',
  '客厅':'壁炉噼啪响着，沙发坐上去会陷进去。灰灰把地毯踩脏了。',
  '厨房':'锅碗瓢盆挂了一排，茶壶还热着。我不太会做饭，但泡茶这件事还行。',
  '浴室':'浴缸里有泡泡，有点奢侈但很值得。磁砖擦得很干净。',
  '灰灰的窝':'灰灰不在，应该又去花园疯跑了。窝里的垫子还是暖的。',
  '储藏室':'乱七八糟塞了很多东西，但我知道每样在哪。来财有时候偷偷飞进来睡觉。',
  '神秘地下室':'……进来之前先敲门。紫色的光从地板缝里透出来，不知道里面有什么。',
  '观星台':'圆顶上有个大望远镜，对准夜空。只有晚上才能上来。',
  '花园':'向日葵努力地长，灰灰在草地上疯跑。小路旁有几朵野花。',
};

const RA={
  '卧室':{b:'摸摸栗子',r:['栗子：呜……别吵……','栗子翻了个身，更窝进枕头里了。','软乎乎的，摸到停不下来。']},
  '书房':{b:'戳戳我',r:['「嗯……等我看完这页。」','「猫猫来啦~」（合上书）','抬起头，眼睛弯弯的。']},
  '阳台':{b:'逗逗鸟',r:['来财：「~~~~~」（高音）','小八：「嗯嗯嗯！」（点头）','乖乖：「……」（装没听到）']},
  '客厅':{b:'拨拨壁炉',r:['火苗跳了一下。','噼——啪！','灰灰也凑了过来蹭热度。']},
  '浴室':{b:'戳戳泡泡',r:['啵——','泡泡没了，又冒出来一个。','啵啵啵！']},
  '神秘地下室':{b:'敲敲门',r:['里面有什么东西动了一下。','……没有回应。','「最好别进来。」（来自地下室）']},
};

const SEm=['🌱','🌿','🌿','🌸','🌻','🌟'];
const ST=['种子在土里','刚发芽了','小苗在长','花苞要开了','开得正好','结了种子✨'];

let curRoom=null;

// 进出
document.getElementById('btn-enter').onclick=()=>{
  document.getElementById('scene-ext').classList.add('gone');
  document.getElementById('scene-int').classList.add('active');
  fetchAll();
};
document.getElementById('btn-exit').onclick=()=>{
  document.getElementById('scene-ext').classList.remove('gone');
  document.getElementById('scene-int').classList.remove('active');
};

// 面板折叠
const panel=document.getElementById('side-panel');
const toggle=document.getElementById('panel-toggle');
toggle.onclick=()=>{
  const open=panel.classList.toggle('open');
  toggle.textContent=open?'›':'☰';
  toggle.style.right=open?'230px':'0';
};

// 热区
document.querySelectorAll('.hotspot').forEach(el=>{
  el.onclick=async()=>{
    const room=el.dataset.room;
    const [notes,who]=await Promise.all([
      get('/notes?select=author,content&room=eq.'+encodeURIComponent(room)+'&order=created_at.desc&limit=3'),
      get('/characters?select=name,mood&location=eq.'+encodeURIComponent(room)),
    ]);
    curRoom=room;
    document.getElementById('card-ttl').textContent=room;
    document.getElementById('card-desc').textContent=RD[room]||'一个温暖的房间。';
    const we=document.getElementById('card-who');
    if(who.length){we.textContent=who.map(c=>c.name+'（'+c.mood+'）').join('  ');we.style.display='block';}else{we.style.display='none';}
    const ne=document.getElementById('card-notes');
    if(notes.length){ne.innerHTML=notes.map(n=>'📝 '+n.author+'：'+n.content).join('<br>');ne.style.display='block';}else{ne.style.display='none';}
    const ac=RA[room];
    const be=document.getElementById('card-btn');
    if(ac){be.textContent=ac.b;be.style.display='inline-block';}else{be.style.display='none';}
    document.getElementById('card-resp').textContent='';
    document.getElementById('overlay').classList.add('open');
  };
});
document.getElementById('card-x').onclick=closeCard;
document.getElementById('overlay').onclick=e=>{if(e.target===e.currentTarget)closeCard();};
function closeCard(){document.getElementById('overlay').classList.remove('open');document.getElementById('card-resp').textContent='';}
document.getElementById('card-btn').onclick=()=>{
  const ac=RA[curRoom];if(!ac)return;
  document.getElementById('card-resp').textContent=ac.r[Math.floor(Math.random()*ac.r.length)];
};

// 数据
async function fetchAll(){
  const d=document.getElementById('rdot');
  d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),600);
  const[chars,sf,logs]=await Promise.all([
    get('/characters?select=name,location,status,mood&order=name.asc'),
    get('/sunflower?select=stage&id=eq.1'),
    get('/home_log?select=event&order=created_at.desc&limit=12'),
  ]);
  renderChars(chars);
  const stage=sf[0]?.stage??0;
  document.getElementById('sf-emoji').textContent=SEm[stage]||'🌱';
  document.getElementById('sf-text').textContent=ST[stage]||'—';
  const ll=document.getElementById('log-list');
  ll.innerHTML=logs.length?logs.map((l,i)=>'<div class="li-item" style="opacity:'+(1-i*.07)+'">'+(l.event||'')+'</div>').join(''):'<div class="li-item">还没发生过什么事。</div>';
  const h=((new Date().getUTCHours()+8)%24+24)%24;
  const tl=['清晨','上午','正午','下午','傍晚','夜晚'];
  document.getElementById('time-disp').textContent='现在是 '+(h<6?'夜晚':h<9?'清晨':h<12?'上午':h<14?'正午':h<18?'下午':h<21?'傍晚':'夜晚');
  const ti=document.getElementById('ticker-inner');
  if(logs.length)ti.innerHTML=logs.slice(0,6).map(l=>'<span>✦</span>'+l.event).join('&nbsp;&nbsp;&nbsp;&nbsp;');
  if(curRoom&&document.getElementById('overlay').classList.contains('open')){
    const who=await get('/characters?select=name,mood&location=eq.'+encodeURIComponent(curRoom));
    const we=document.getElementById('card-who');
    if(who.length){we.textContent=who.map(c=>c.name+'（'+c.mood+'）').join('  ');we.style.display='block';}else{we.style.display='none';}
  }
}

function renderChars(chars){
  document.getElementById('chars-list').innerHTML=chars.map(c=>{
    const cfg=CC[c.name]||{e:'✦'};
    const mc=MC[c.mood]||'#9a7848';
    return '<div class="ci"><span class="ci-emoji">'+cfg.e+'</span><div class="ci-info"><div class="ci-name">'+c.name+'</div><div class="ci-loc">'+c.location+'</div></div><span class="ci-mood" style="background:'+mc+'22;color:'+mc+'">'+c.mood+'</span></div>';
  }).join('');
  Object.keys(RO).forEach(k=>RO[k]=[]);
  const layer=document.getElementById('chars-layer');
  layer.innerHTML='';
  chars.forEach(c=>{
    const cfg=CC[c.name]||{e:'✦',d:'0s'};
    const mc=MC[c.mood]||'#9a7848';
    const pos=gPos(c.location,c.name);
    const pin=document.createElement('div');
    pin.className='char-pin';
    pin.style.left=pos.l+'%';
    pin.style.top=pos.t+'%';
    pin.innerHTML='<div style="position:relative"><span class="char-emoji" style="animation-delay:'+cfg.d+'">'+cfg.e+'</span><span class="mood-dot" style="background:'+mc+'"></span></div><div class="char-label">'+c.name+'</div>';
    layer.appendChild(pin);
  });
}

setInterval(fetchAll,8000);
</script>
</body>
</html>
